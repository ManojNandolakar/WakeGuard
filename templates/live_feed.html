<!DOCTYPE html>
<html>
<head>
<title>Driver Monitoring Live Feed</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
/* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
font-family:Arial;
text-align:center;
background:#111;
color:white;
}

/* Top Navigation */
nav {
    width: 100%;
    background-color: #ffffff;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    position: sticky;
    top: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
}

nav .logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

nav .logo img {
    width: 100px;
    height: 55px;
    border-radius: 8px;
    margin: 5px;
}

nav ul {
    display: flex;
    list-style: none;
    gap: 30px;
}

nav ul li a {
    text-decoration: none;
    color: #333;
    font-weight: 500;
    font-size: 16px;
    transition: 0.3s;
    padding: 8px 12px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
}

nav ul li a:hover {
    background-color: #4facfe;
    color: white;
}

img{
border:5px solid white;
border-radius:10px;
}
</style>

</head>

<body>

    <!-- Navbar -->
<nav>
    <div class="logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="AI Robot">
    </div>
    <ul>
        <!-- <li><a href="{{ url_for('video') }}"><i class="fas fa-video"></i> Live Video</a></li> -->
        <li><a href="{{ url_for('home_back') }}"><i class="fas fa-home"></i> Home</a></li>
        <li><a href="/live_feed"><i class="fas fa-video"></i>Live Feed</a></li>
        <li><a href="{{ url_for('team') }}"><i class="fas fa-users"></i> Team</a></li>
        <li><a href="{{ url_for('logs') }}"><i class="fas fa-table"></i> Logs</a></li>
        <li><a href="{{ url_for('about') }}"><i class="fas fa-info-circle"></i> About</a></li>
        <li><a href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
    </ul>
</nav>


<h1>AI Driver Monitoring System</h1>

<!-- <img src="{{ url_for('video_feed') }}" width="800"> -->
<img src="/video_feed" width="90%">
<br><br>


</body>
</html>
