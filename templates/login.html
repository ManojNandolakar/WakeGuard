<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Driver Monitoring - Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0a192f,#112240);
}

.container{
    width:85%;
    max-width:1100px;
    height:85vh;
    display:flex;
    border-radius:25px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    box-shadow:0 20px 40px rgba(0,0,0,0.4);
    overflow:hidden;
}

.left{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1f4068,#162447);
}

.left img{
    width:75%;
    max-width:380px;
    border-radius:25px;

    /* Glassy dark blue shadow animation */
    animation: glassyShadow 5s ease-in-out infinite alternate;
    box-shadow: 0 0 20px rgb(0, 0, 0); /* initial shadow */
}

@keyframes glassyShadow {
    0% {
        transform: scale(1);
        box-shadow: 0 0 40px rgb(0, 0, 0), 0 0 40px rgb(0, 0, 0);
    }
    50% {
        transform: scale(1.03);
        box-shadow: 0 0 60px rgb(0, 0, 0), 0 0 60px rgb(255, 255, 255);
    }
    100% {
        transform: scale(1);
        box-shadow: 0 0 40px rgb(0, 0, 0), 0 0 40px rgb(0, 0, 0);
    }
}

.right{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:60px;
    color:white;
}

.logo{
    font-size:32px;
    font-weight:bold;
    margin-bottom:40px;
}

.form-group{
    display:flex;
    flex-direction:column;
    margin-bottom:18px;
}

label{
    font-size:14px;
    margin-bottom:6px;
}

input{
    padding:12px;
    border:none;
    border-radius:8px;
    outline:none;
    font-size:14px;
    background:#1f4068;
    color:white;
}

input::placeholder{
    color:#cbd5e1;
}

.message{
    color:#ff6b6b;
    font-size:14px;
    text-align:center;
    margin:10px 0 15px 0;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:25px;
    background:linear-gradient(to right,#4facfe,#00f2fe);
    color:white;
    font-size:15px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

.signup{
    margin-top:25px;
    font-size:13px;
    text-align:center;
}

.signup a{
    color:#4facfe;
    text-decoration:none;
}

@media(max-width:900px){
    .container{
        flex-direction:column;
        height:auto;
    }
    .left{
        display:none;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="left">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="AI Robot">
    </div>

    <div class="right">

        <div class="logo">Login</div>

        <form action="/login" method="POST">

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="name" placeholder="Enter Username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter Password" required>
            </div>

            {% if message %}
            <div class="message">{{ message }}</div>
            {% endif %}

            <button type="submit">Sign In</button>

            <div class="signup">
                New User? 
                <a href="/signup">Create an Account</a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
